# FlyTrace reverse proxy.
#
# Responsibilities, in the order they matter:
#   1. TLS termination and HTTP→HTTPS redirect.
#   2. Establish the REAL client address, so rate-limit keys and audit records
#      cannot be forged (see the `set_real_ip_from` block below).
#   3. Keep /metrics and /health/detailed off the public internet.
#   4. WebSocket upgrade for /ws with a long read timeout.
#   5. Bound request bodies and upstream timeouts.

# ── Trusted proxy chain ────────────────────────────────────────────────────
# `X-Forwarded-For` is a client-settable header. If we forwarded it verbatim,
# anyone could send `X-Forwarded-For: 1.2.3.4` and land in a different
# rate-limit bucket for every request — defeating the limiter entirely.
#
# `real_ip_header X-Forwarded-For` + `set_real_ip_from` makes nginx trust the
# header ONLY when the connection comes from a listed network, and rewrite
# `$remote_addr` to the real client. We then send that value on, OVERWRITING
# whatever the client supplied.
#
# Adjust these to your actual edge: add Cloudflare's ranges if you sit behind
# it, otherwise keep only the Docker/LAN networks in front of this proxy.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Internal networks allowed to reach the operational endpoints. This is the
# proxy-level half of the defence; the app ALSO requires INTERNAL_API_TOKEN.
geo $internal_client {
    default        0;
    10.0.0.0/8     1;
    172.16.0.0/12  1;
    192.168.0.0/16 1;
    127.0.0.0/8    1;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream flytrace_api { server api:3001; keepalive 32; }
upstream flytrace_web { server web:3000; keepalive 32; }

# ── HTTP: redirect everything except the ACME challenge ────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Proxy's own liveness — never proxied upstream.
    location = /nginx-health { access_log off; return 200 "ok\n"; }

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 308 https://$host$request_uri; }
}

# ── HTTPS ──────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── Security headers ──
    # HSTS is only safe once every subdomain is HTTPS; leave `preload` off until
    # you are certain, because submission is effectively irreversible.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(self), microphone=(), camera=()" always;
    # CSP is emitted per-response by the app (it carries a per-request nonce),
    # so it is deliberately NOT set here — a static header would override it.

    # Do not advertise the server version.
    server_tokens off;

    # ── Body size and timeouts ──
    # 1 MB is ample for this API's JSON payloads and CSP reports; anything
    # larger is either a bug or an attempt to exhaust memory.
    client_max_body_size 1m;
    client_body_timeout  15s;
    client_header_timeout 15s;
    send_timeout         30s;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    # Overwrite, never append: the real client address is the one nginx
    # resolved above, not whatever arrived in the request.
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    # Strip any inbound internal-auth header so a client cannot smuggle one
    # toward /metrics through a path we did not anticipate.
    proxy_set_header X-Internal-Token  "";

    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # ── Operational endpoints: internal only ──
    # Belt and braces. The app also enforces INTERNAL_API_TOKEN, so a
    # misconfiguration here does not by itself expose them.
    location = /metrics {
        if ($internal_client = 0) { return 403; }
        proxy_pass http://flytrace_api;
    }

    location = /health/detailed {
        if ($internal_client = 0) { return 403; }
        proxy_pass http://flytrace_api;
    }

    # ── Public probes ──
    location = /health       { access_log off; proxy_pass http://flytrace_api; }
    location = /health/ready { access_log off; proxy_pass http://flytrace_api; }

    # ── WebSocket ──
    location /ws {
        proxy_pass http://flytrace_api;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Long-lived by design; the app's own heartbeat detects dead peers, so
        # the proxy must not cut a healthy idle subscription.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # ── API ──
    location /api/ {
        proxy_pass http://flytrace_api;
        # Auth responses set cookies and must never be cached by an
        # intermediary.
        proxy_no_cache     1;
        proxy_cache_bypass 1;
    }

    # ── Web app ──
    location / {
        proxy_pass http://flytrace_web;
    }

    # Next.js immutable build assets.
    location /_next/static/ {
        proxy_pass http://flytrace_web;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
