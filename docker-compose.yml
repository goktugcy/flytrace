# FlyTrace — local development infrastructure.
# Usage: docker compose up -d   (Postgres+PostGIS + Redis)
# App processes run on the host via `bun run dev` for fast hot reload.

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: flytrace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flytrace
      POSTGRES_PASSWORD: flytrace
      POSTGRES_DB: flytrace
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h forces TCP; the socket answers during init while TCP is still closed.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U flytrace -d flytrace']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: flytrace-redis
    restart: unless-stopped
    # Redis holds only the rebuildable hot state / event stream, so persistence
    # is off (AOF disabled + no RDB snapshots). This avoids multi-GB dumps and
    # AOF-corruption crash loops; the tracker repopulates it from live feeds in
    # seconds. A memory cap with LRU eviction keeps the global feed bounded.
    command:
      [
        'redis-server',
        '--appendonly',
        'no',
        '--save',
        '',
        '--maxmemory',
        '1gb',
        '--maxmemory-policy',
        'allkeys-lru',
      ]
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
