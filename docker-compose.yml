# FlyTrace — local development infrastructure.
# Usage: docker compose up -d   (Postgres+PostGIS + Redis)
# App processes run on the host via `bun run dev` for fast hot reload.

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: flytrace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flytrace
      POSTGRES_PASSWORD: flytrace
      POSTGRES_DB: flytrace
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flytrace -d flytrace']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: flytrace-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
