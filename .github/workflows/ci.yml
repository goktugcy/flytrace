name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: nothing here writes to the repository or publishes packages.
permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  # ── 1. lint · typecheck · unit tests ───────────────────────────────────────
  quality:
    name: Lint · Typecheck · Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        # --frozen-lockfile fails the build if a manifest and bun.lock disagree,
        # so a dependency can never be added implicitly by CI.
        run: bun install --frozen-lockfile

      - name: Verify the lockfile was not modified by install
        # Belt and braces: --frozen-lockfile already errors, but this also
        # catches a lockfile that installs cleanly yet still gets rewritten.
        run: git diff --exit-code -- bun.lock

      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-quality-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-quality-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            turbo-quality-${{ runner.os }}-

      - name: Lint & format check
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

  # ── 2. migrations · seed · database-backed tests ──────────────────────────
  database:
    name: Migrations · Seed · DB tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: flytrace
          POSTGRES_PASSWORD: flytrace
          POSTGRES_DB: flytrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flytrace -d flytrace"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # A throwaway CI database. These are not secrets and are never reused.
      DATABASE_URL: postgres://flytrace:flytrace@localhost:5432/flytrace
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply migrations to a clean PostGIS instance
        run: bun run db:migrate

      - name: Migrations are idempotent (re-deploy safety)
        # A second run must be a no-op. This is what a rolling re-deploy does,
        # and a migration that only works once would break it.
        run: bun run db:migrate

      - name: Assert no raw bearer-token column survived the migration
        # The key post-condition of migration 0005, asserted in SQL as well as
        # in the tests: this is the property a careless future migration is most
        # likely to reintroduce.
        run: |
          COUNT=$(psql "$DATABASE_URL" -tAc "
            select count(*) from information_schema.columns
            where (table_name = 'sessions' and column_name = 'token')
               or (table_name = 'notification_channels' and column_name = 'link_token');")
          echo "plaintext token columns found: $COUNT"
          test "$COUNT" = "0"

      - name: Seed
        run: bun run db:seed

      - name: Verify seed / fixture data landed
        run: |
          providers=$(psql "$DATABASE_URL" -tAc "select count(*) from providers;")
          settings=$(psql "$DATABASE_URL" -tAc "select count(*) from settings;")
          echo "providers=$providers settings=$settings"
          test "$providers" -gt 0
          test "$settings" -gt 0

      - name: Database-backed repository tests
        run: bun --filter @flytrace/db test

      - name: Integration smoke test (tracker → redis → worker → postgres → api)
        run: bun --filter @flytrace/integration-tests test

  # ── 3. production build ───────────────────────────────────────────────────
  build:
    name: Production build (api · web · tracker · worker · notifier)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: production
      # Public, non-secret build-time values. NEXT_PUBLIC_* is inlined into the
      # client bundle, so a real secret must NEVER appear here.
      NEXT_PUBLIC_API_URL: https://api.ci.invalid
      NEXT_PUBLIC_WS_URL: wss://api.ci.invalid/ws
      NEXT_PUBLIC_TURNSTILE_ENABLED: 'false'
      CSP_MODE: enforce
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            .turbo/cache
            apps/web/.next/cache
          key: turbo-build-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-build-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            turbo-build-${{ runner.os }}-

      - name: Build every production app
        run: bun run build

      - name: Assert each service produced a runnable bundle
        run: |
          for app in api tracker worker notifier; do
            test -f "apps/$app/dist/index.js" || { echo "missing apps/$app/dist/index.js"; exit 1; }
          done
          test -d apps/web/.next/standalone || { echo "missing Next standalone output"; exit 1; }

      - name: Assert no server secret leaked into the client bundle
        # NEXT_PUBLIC_* is inlined verbatim, so this catches the day someone
        # adds a server-only secret under that prefix by mistake.
        run: |
          if grep -rIlE '(AUTH_SECRET|INTERNAL_API_TOKEN|MFA_SECRET_ENCRYPTION_KEY|POSTGRES_PASSWORD|REDIS_PASSWORD)' apps/web/.next/static 2>/dev/null; then
            echo "a server-only secret name appears in the client bundle"; exit 1
          fi
          echo "client bundle is clean"

      # Only the API bundle is kept, and only for a week: it is the artifact a
      # human might actually want after a failed deploy. Source maps and the
      # (large) Next output stay out of the artifact store.
      - name: Upload API bundle
        uses: actions/upload-artifact@v4
        with:
          name: api-bundle-${{ github.sha }}
          path: apps/api/dist/index.js
          retention-days: 7
          if-no-files-found: error

  # ── 4. container images ───────────────────────────────────────────────────
  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [quality]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build every image
        uses: docker/bake-action@v5
        with:
          files: deploy/docker-bake.hcl
          targets: default
          # Load into the local daemon so the assertions below can run them.
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: Every image must run as a non-root user
        run: |
          for img in api tracker worker notifier migrate; do
            user=$(docker run --rm --entrypoint sh "flytrace/$img:ci" -c 'id -un')
            echo "$img runs as: $user"
            test "$user" != "root" || { echo "$img runs as root"; exit 1; }
          done
          web_user=$(docker run --rm --entrypoint sh flytrace/web:ci -c 'id -un')
          echo "web runs as: $web_user"
          test "$web_user" != "root"

      - name: No .env, lockfile or source tree in a runtime image
        run: |
          leaked=$(docker run --rm --entrypoint sh flytrace/api:ci -c \
            'find / -xdev \( -name ".env" -o -name ".env.*" -o -name "bun.lock" \) 2>/dev/null | head')
          test -z "$leaked" || { echo "leaked into the image: $leaked"; exit 1; }
          echo "no secrets or lockfile in the image"

      - name: API image boots, is protected, and shuts down gracefully
        run: |
          docker network create ft-ci
          docker run -d --name ci-pg --network ft-ci \
            -e POSTGRES_USER=flytrace -e POSTGRES_PASSWORD=flytrace -e POSTGRES_DB=flytrace \
            postgis/postgis:16-3.4
          docker run -d --name ci-redis --network ft-ci redis:7-alpine
          for i in $(seq 1 30); do
            docker exec ci-pg pg_isready -U flytrace -d flytrace && break || sleep 2
          done

          echo "── the dedicated migration job runs once, before any app ──"
          docker run --rm --network ft-ci \
            -e DATABASE_URL=postgres://flytrace:flytrace@ci-pg:5432/flytrace \
            flytrace/migrate:ci

          docker run -d --name ci-api --network ft-ci -p 3001:3001 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            -e APP_ENV=production -e NODE_ENV=production \
            -e DATABASE_URL=postgres://flytrace:flytrace@ci-pg:5432/flytrace \
            -e REDIS_URL=redis://ci-redis:6379 \
            -e AUTH_SECRET=ci-only-auth-secret-not-a-real-secret-32 \
            -e AUTH_URL=http://localhost:3001 \
            -e CORS_ORIGINS=http://localhost:3000 \
            -e RATE_LIMIT_BACKEND=redis -e MFA_CHALLENGE_BACKEND=redis -e AUDIT_BACKEND=db \
            -e INTERNAL_API_TOKEN=ci-only-internal-token-not-a-real-secret \
            -e MFA_SECRET_ENCRYPTION_KEY=ci-only-mfa-key-not-a-real-secret \
            -e EMAIL_API_KEY=ci-only-email-key-not-a-real-secret \
            flytrace/api:ci

          for i in $(seq 1 30); do
            curl -fsS http://localhost:3001/health >/dev/null && break || sleep 2
          done

          echo "── public probes ──"
          curl -fsS http://localhost:3001/health       >/dev/null
          curl -fsS http://localhost:3001/health/ready >/dev/null

          echo "── internal endpoints closed without a token ──"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/metrics)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/health/detailed)" = "404"

          echo "── and open with one ──"
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Authorization: Bearer ci-only-internal-token-not-a-real-secret' \
            http://localhost:3001/metrics)" = "200"

          echo "── the websocket gateway answers the handshake (401 = no ticket) ──"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/ws)" = "401"

          echo "── full sign-up → refresh → reuse-detection round trip ──"
          curl -fsS -D /tmp/h1 -o /dev/null -X POST http://localhost:3001/api/auth/sign-up \
            -H 'content-type: application/json' -H 'origin: http://localhost:3000' \
            -d '{"email":"ci@example.test","password":"ci-password-1"}'
          grep -qi 'flytrace_session=' /tmp/h1
          grep -qi 'flytrace_refresh=' /tmp/h1
          # The refresh cookie must be scoped away from ordinary API traffic.
          grep -i 'flytrace_refresh=' /tmp/h1 | grep -q 'Path=/api/auth'
          grep -i 'flytrace_refresh=' /tmp/h1 | grep -q 'HttpOnly'

          echo "── docker healthcheck reports healthy ──"
          for i in $(seq 1 20); do
            status=$(docker inspect --format '{{.State.Health.Status}}' ci-api)
            [ "$status" = "healthy" ] && break || sleep 3
          done
          test "$status" = "healthy"

          echo "── graceful shutdown on SIGTERM ──"
          docker stop -t 20 ci-api
          docker logs ci-api 2>&1 | tail -5
          docker logs ci-api 2>&1 | grep -q "api shutting down"
          test "$(docker inspect --format '{{.State.ExitCode}}' ci-api)" = "0"

      - name: Tear down
        if: always()
        run: |
          docker rm -f ci-api ci-pg ci-redis >/dev/null 2>&1 || true
          docker network rm ft-ci >/dev/null 2>&1 || true

  # ─────────────────────────────────────────────────────────────── deploy ──
  # Only after every check above passes, and only for a push to main — a pull
  # request from a fork must never be able to reach the server.
  #
  # The server holds .env.production and the TLS certificates as UNTRACKED
  # files, so `git reset --hard` restores tracked files without touching them.
  # Reset rather than pull because the working tree there is edited by hand
  # during incidents, and a merge conflict would leave a half-deployed box.
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [quality, database, build, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    environment: production
    steps:
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin the host key instead of accepting whatever answers: without this
          # a DNS or routing hijack would hand our deploy key to a stranger.
          printf '%s\n' "${{ secrets.DEPLOY_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          SHA: ${{ github.sha }}
        run: |
          # The heredoc is QUOTED, so nothing expands on the runner; the commit
          # sha travels as an environment variable instead. Mixing the two sides
          # in one unquoted heredoc is how deploy scripts end up running the
          # runner's idea of a path against the server.
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$USER@$HOST" \
            "SHA='$SHA' bash -euo pipefail -s" <<'EOF'
            cd /srv/flytrace
            DC="docker compose -f docker-compose.production.yml --env-file .env.production"

            echo "── fetching $SHA ──"
            git fetch --quiet origin main
            git reset --hard "$SHA"

            echo "── building ──"
            $DC build

            echo "── migrating + starting ──"
            $DC up -d --remove-orphans

            echo "── waiting for health ──"
            for _ in $(seq 1 40); do
              pending=$($DC ps --format '{{.Service}} {{.Status}}' | grep -cvE 'healthy|Exit 0' || true)
              if [ "$pending" = "0" ]; then break; fi
              sleep 5
            done
            $DC ps
          EOF

      - name: Smoke test
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$USER@$HOST" bash -euo pipefail <<'EOF'
            cd /srv/flytrace
            DC="docker compose -f docker-compose.production.yml --env-file .env.production"
            api_host=$(grep '^AUTH_URL=' .env.production | cut -d= -f2- | sed 's#https://##')
            token=$(grep '^INTERNAL_API_TOKEN=' .env.production | cut -d= -f2-)

            probe() {
              code=$($DC exec -T proxy sh -c \
                "wget -qO- -S --header='Host: $api_host' ${2:-} https://127.0.0.1$1 \
                 --no-check-certificate 2>&1 | awk '/HTTP\//{print \$2; exit}'")
              echo "  $1 -> $code (expected $3)"
              test "$code" = "$3"
            }
            probe /health "" 200
            probe /health/ready "" 200
            probe /metrics "" 404
            probe /metrics "--header=\"Authorization: Bearer $token\"" 200
          EOF

      - name: Report failure
        if: failure()
        run: |
          echo "::error::Deploy failed. The previous containers are still running unless"
          echo "::error::the build succeeded and health checks then failed — check with:"
          echo "::error::  ssh <host> 'cd /srv/flytrace && docker compose -f docker-compose.production.yml --env-file .env.production ps'"
